name: Desktop app

# Builds the installers: a universal macOS .dmg (Apple silicon and Intel), a Windows setup .exe and a Linux
# AppImage, each uploaded as a workflow artifact. Runs when the planner or its desktop shell changes, by hand from
# the Actions tab, and for v* tags. The first pushed build of each version in package.json (or a pushed v* tag)
# also publishes the installers as a GitHub release with install steps; later builds of that version don't touch it.
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - index.html
      - '*.js'
      - vendor/**
      - desktop/**
      - package.json
      - package-lock.json
      - .github/workflows/desktop.yml
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: --mac, files: dist/*.dmg }
          - { os: windows-latest, target: --win, files: dist/*.exe }
          - { os: ubuntu-latest, target: --linux, files: dist/*.AppImage }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Lets-Party-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; else tag="v$(node -p "require('./package.json').version")"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.version.outputs.new == 'true'
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Let’s Party ${{ steps.version.outputs.tag }}
          files: installers/*
          body: |
            Download the file for your computer from **Assets** below, then:

            **Mac** (`…-mac-universal.dmg`, for Apple silicon and Intel Macs)
            1. Double-click the downloaded file. A window opens showing the app.
            2. Drag the app onto the Applications folder in that window.
            3. Open your Applications folder and double-click **Let’s Party**.
            4. The first time only, macOS says it can't verify the app. Click **Done**, open **System Settings → Privacy & Security**, scroll down, click **Open Anyway**, then **Open**. From then on it opens normally.

            **Windows** (`…-win-x64.exe`)
            1. Double-click the downloaded file.
            2. If you see "Windows protected your PC", click **More info**, then **Run anyway**.
            3. Follow the installer. It adds **Let’s Party** to the Start menu.

            **Linux** (`…-linux-x86_64.AppImage`): make the file executable, then run it.

            In the app, choose the venue in the box at the top left (or the **Venue** menu), then use **File → Load Example** to see a sample layout.
